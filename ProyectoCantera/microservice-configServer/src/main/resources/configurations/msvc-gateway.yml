eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: cargo
          uri: lb://msvc-cargo
          predicates:
            - Path=/api/cargo/**
        - id: turno
          uri: lb://msvc-turno
          predicates:
            - Path=/api/turno/**
        - id: mesa
          uri: lb://msvc-mesa
          predicates:
            - Path=/api/mesa/**
        - id: delivery
          uri: lb://msvc-delivery
          predicates:
            - Path=/api/delivery/**
        - id: categoria
          uri: lb://msvc-categoria
          predicates:
            - Path=/api/categoriaproducto/**
        - id: privilegio
          uri: lb://msvc-privilegio
          predicates:
            - Path=/api/privilegio/**
        - id: usuario
          uri: lb://msvc-usuario
          predicates:
            - Path=/api/usuario/**
        - id: empleado
          uri: lb://msvc-empleado
          predicates:
            - Path=/api/empleado/**